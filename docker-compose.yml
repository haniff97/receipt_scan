version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - receipt_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/receipts.db
      - UPLOAD_DIR=/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4006:80"
    depends_on:
      - backend

volumes:
  receipt_data:
